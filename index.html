<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Practice</title>
<style>
:root{--ground:#ffffff;--ink:#1e1e1e;--ink-2:#404040;--muted:#6b6b6b;--line:#bfbfbf;--accent:#ffa600;--blocked:#b32714;--font:"Noto Sans",Arial,Helvetica,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--ground:#1e1e1e;--ink:#f2f2f2;--ink-2:#d0d0d0;--muted:#a3a3a3;--line:#4a4a4a;--blocked:#e0533e;color-scheme:dark}}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{width:100%;max-width:400px;display:grid;gap:14px}
.mark{display:grid;gap:3px;width:26px}.mark i{display:block;height:4px;background:var(--line)}.mark i:nth-child(2){background:var(--accent)}
h1{font-weight:300;font-size:30px;margin:4px 0 0;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5}
label{font-size:13px;color:var(--muted)}
input[type=password]{width:100%;box-sizing:border-box;font:16px var(--font);padding:11px 12px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2)}
button{font:600 15px var(--font);padding:11px 14px;border:1px solid var(--accent);background:var(--accent);color:#1e1e1e;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--blocked);font-size:14px;min-height:1.4em}
.lockbtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;font:12px var(--font);padding:6px 10px;background:var(--ground);color:var(--ink-2);border:1px solid var(--line)}
</style>
</head>
<body>
<main class="gate" id="gate">
  <form class="card" id="f" autocomplete="on">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1>Practice</h1>
    <p>This space is encrypted. Enter the passphrase to open it.</p>
    <input type="text" name="username" value="field-guide" autocomplete="username" hidden>
    <label for="pw">Passphrase</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="row"><input type="checkbox" id="keep" checked> Stay unlocked on this device</label>
    <button type="submit" id="go">Open</button>
    <p class="err" id="err" aria-live="polite"></p>
  </form>
</main>
<script>
(function(){
  var CFG = {"salt": "Hzk/I1OfltCIaEftIs7HAg==", "iter": 600000, "app": "app.enc", "keyring": "keyring.enc"};
  var KEY_STORE = "cxf-unlock-key";
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function err(t){ document.getElementById("err").textContent = t; }
  async function derive(pw){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CFG.salt), iterations: CFG.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  }
  async function openBlob(buf, priv){
    var u = new Uint8Array(buf), L = (u[3] << 8) | u[4];
    var raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, priv, u.slice(5, 5 + L));
    var k = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(5 + L, 17 + L) }, k, u.slice(17 + L));
  }
  async function openApp(key){
    var kr = new Uint8Array(await (await fetch(CFG.keyring, { cache: "no-cache" })).arrayBuffer());
    var der = await crypto.subtle.decrypt({ name: "AES-GCM", iv: kr.slice(0, 12) }, key, kr.slice(12));
    var priv = await crypto.subtle.importKey("pkcs8", der, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
    var buf = await (await fetch(CFG.app, { cache: "no-cache" })).arrayBuffer();
    var plain = await openBlob(buf, priv);
    window.__cxfKey = key; window.__acadPriv = priv;
    var html = new TextDecoder().decode(plain);
    var tpl = document.createElement("template"); tpl.innerHTML = html;
    var scripts = [];
    document.getElementById("gate").remove();
    Array.from(tpl.content.childNodes).forEach(function(n){
      if (n.nodeName === "SCRIPT") { scripts.push(n.textContent); return; }
      if (n.nodeName === "TITLE") { document.title = n.textContent; return; }
      document.body.appendChild(n);
    });
    scripts.forEach(function(code){ var s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); });
    var lock = document.createElement("button"); lock.className = "lockbtn"; lock.type = "button"; lock.textContent = "Lock";
    lock.title = "Forget the passphrase on this device";
    lock.onclick = function(){ try { localStorage.removeItem(KEY_STORE); } catch (e) {} location.reload(); };
    document.body.appendChild(lock);
  }
  async function tryStored(){
    var raw = null; try { raw = localStorage.getItem(KEY_STORE); } catch (e) {}
    if (!raw) return false;
    try {
      var key = await crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
      await openApp(key); return true;
    } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (x) {} return false; }
  }
  document.getElementById("f").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Unlocking"; err("");
    try {
      var keep = !!(document.getElementById("keep") && document.getElementById("keep").checked);
      var key = await derive(document.getElementById("pw").value);
      await openApp(key);
      if (keep) {
        var raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode.apply(null, raw))); } catch (e) {}
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = "Open";
      err(window.crypto && crypto.subtle ? "Wrong passphrase. Check for typos and try again." : "This browser cannot decrypt the app. Open it in a current browser over https.");
    }
  });
  tryStored();
})();
</script>
</body>
</html>
